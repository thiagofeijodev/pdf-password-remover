[package]
name = "rust_heic_converter"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
image = "0.24"

[profile.release]
opt-level = "z"
lto = true
